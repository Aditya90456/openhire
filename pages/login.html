<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>
<div id="impersonationBanner"></div>

<main class="auth-shell">
  <div class="auth-card reveal">
    <div class="auth-mark">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <rect x="56" y="6" width="8" height="34" fill="var(--primary-invert)"></rect>
        <rect x="56" y="80" width="8" height="34" fill="var(--primary-invert)"></rect>
        <rect x="6" y="56" width="34" height="8" fill="var(--primary-invert)"></rect>
        <rect x="80" y="56" width="34" height="8" fill="var(--primary-invert)"></rect>
        <rect x="30" y="30" width="8" height="8" fill="var(--primary-invert)"></rect>
        <rect x="82" y="30" width="8" height="8" fill="var(--primary-invert)"></rect>
        <rect x="30" y="82" width="8" height="8" fill="var(--primary-invert)"></rect>
        <rect x="82" y="82" width="8" height="8" fill="var(--primary-invert)"></rect>
      </svg>
    </div>
    <h1 class="auth-title">Log into OpenHire</h1>
    <p class="auth-sub">Enter your credentials to access your account.</p>

    <div id="errorMessage" class="alert alert-danger auth-error" style="display:none; margin-bottom:1rem;"></div>

    <form class="auth-form" onsubmit="event.preventDefault(); handleLoginSubmit();">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="e.g. name@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <button id="submitBtn" type="submit" class="btn-primary auth-submit">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="signup.html">Create one</a>
    </p>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar();

  async function handleLoginSubmit() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Validation
    if (!email || !password) {
      errorDiv.textContent = 'Please enter both email and password.';
      errorDiv.style.display = 'block';
      return;
    }

    if (!email.includes('@')) {
      errorDiv.textContent = 'Please enter a valid email address.';
      errorDiv.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    errorDiv.style.display = 'none';

    try {
      const response = await apiRequest('/auth/login', {
        method: 'POST',
        body: {
          email,
          password,
        },
      });

      // Store tokens and user info
      setTokens(response.access_token, response.refresh_token);
      setCurrentUser({
        name: response.user.email,
        role: response.user.user_type,
        user_id: response.user.user_id,
      });
      // Re-resolve candidate_id from the backend rather than leaving it
      // wiped until the dashboard's own self-heal runs - see
      // resolveCandidateId()'s doc comment in js/app.js for why this
      // matters (a returning candidate's applications showing as zero).
      if (response.user.user_type === 'candidate') {
        await resolveCandidateId();
      }

      // Redirect to appropriate dashboard
      let dashboard;
      if (response.user.user_type === 'admin') {
        dashboard = 'admin.html';
      } else if (response.user.user_type === 'recruiter') {
        dashboard = 'recruiter.html';
      } else {
        dashboard = 'candidate.html';
      }
      window.location.href = dashboard;
    } catch (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      errorDiv.textContent = error.message || 'Login failed. Please check your credentials.';
      errorDiv.style.display = 'block';
    }
  }
</script>
</body>
</html>
