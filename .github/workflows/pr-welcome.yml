name: PR Welcome

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Comment welcome message
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              "👋 Thanks for opening this PR! A maintainer will review it soon.",
              "",
              `In the meantime, please make sure you've read [CONTRIBUTING.md](${repoUrl}/blob/main/CONTRIBUTING.md) and filled out the PR template, including screenshots for any visual changes.`
            ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
